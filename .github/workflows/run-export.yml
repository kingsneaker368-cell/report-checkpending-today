
name: Export Sheets to Telegram

on:
  workflow_dispatch:

  schedule:
    # Quét lịch mỗi 5 phút, lệch 2 phút so với mốc tròn
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: export-checkpending-telegram
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick ghostscript

      - name: Install dependencies
        run: npm ci

      - name: Run export script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAMES: ${{ secrets.SHEET_NAMES }}
          START_COL: ${{ secrets.START_COL }}
          END_COL: ${{ secrets.END_COL }}
          MAX_ROWS_PER_FILE: ${{ secrets.MAX_ROWS_PER_FILE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Phân biệt chạy tự động và thủ công
          RUN_MODE: ${{ github.event_name == 'schedule' && 'auto' || 'manual' }}

        run: node index.js
